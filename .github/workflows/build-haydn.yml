name: Build Haydn Kernel for Droidspaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space (LTO builds need ~20GB)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm /opt/pipx 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Create swap (prevent OOM on 2GB runner)
        run: |
          # GitHub-hosted runners already mount /swapfile ("Text file busy"
          # if we skip this), so disable and recreate it
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libncurses5-dev \
            libncursesw5-dev xz-utils curl wget git lz4 cpio python3 \
            unzip zip p7zip-full device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang llvm lld patch

      - name: Clone LineageOS haydn kernel source
        run: |
          git clone --depth=1 -b lineage-23.2 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git kernel
          cd kernel
          echo "=== Kernel commit ==="
          git log --oneline -1
          echo "=== Available defconfigs ==="
          ls arch/arm64/configs/vendor/

      - name: Download Neutron Clang toolchain
        run: |
          # GKI kernels MUST be built with an Android clang (LTO+CFI+SCS).
          # Ubuntu clang 14 silently downgrades LTO_CLANG/CFI/SCS -> vendor
          # modules (built with CFI+SCS) crash the kernel at boot.
          # Reference: quilluna/android_kernel_oneplus_sm8350_ds (Neutron Clang).
          mkdir -p "$GITHUB_WORKSPACE/neutron-clang"
          cd "$GITHUB_WORKSPACE/neutron-clang"
          curl -sLO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S=latest
          ./antman --patch=glibc
          ./bin/clang --version
          ls bin/ | grep -E "^ld.lld|^llvm-ar" || true
          # Persist PATH for all later steps (config + build)
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      - name: Apply GKI KABI patches (required for 5.4 GKI, prevents bootloop)
        run: |
          cd kernel
          python3 ../scripts/apply_gki_kabi.py

      - name: Apply Droidspaces kernel config
        run: |
          cd kernel
          # LineageOS builds haydn with THREE configs merged in this exact order
          # (BoardConfigCommon.mk): base defconfig + debugfs + xiaomi_QGKI.
          # The xiaomi_QGKI.config enables techpack providers (mi_disp, cnss hw
          # version helpers) whose symbols are referenced by built-in drivers;
          # omitting it causes undefined-reference link errors in vmlinux.
          for frag in vendor/lahaina-qgki_defconfig vendor/debugfs.config vendor/xiaomi_QGKI.config; do
            if [ ! -f "arch/arm64/configs/$frag" ]; then
              echo "ERROR: missing config fragment $frag"
              exit 1
            fi
          done
          make ARCH=arm64 vendor/lahaina-qgki_defconfig vendor/debugfs.config vendor/xiaomi_QGKI.config

          # Apply Droidspaces options to .config using scripts/config (precise, no duplicates)
          while IFS='=' read -r key val; do
            # Skip comments and blank lines
            case "$key" in
              \#*|"") continue ;;
            esac
            case "$val" in
              y) scripts/config --file .config --enable "$key" ;;
              n) scripts/config --file .config --disable "$key" ;;
              m) scripts/config --file .config --module "$key" ;;
              *) scripts/config --file .config --set-str "$key" "$val" ;;
            esac
          done < ../configs/haydn-droidspaces.fragment

          # Resolve dependencies (.config is the build source of truth;
          # no savedefconfig churn on the vendor defconfig)
          make ARCH=arm64 olddefconfig

          echo "=== Verifying key Droidspaces options ==="
          grep -E 'CONFIG_(PID_NS|IPC_NS|UTS_NS|NAMESPACES|DEVTMPFS|SYSVIPC|POSIX_MQUEUE|SECCOMP)' .config || true

          # ABI-critical check right after olddefconfig: if the toolchain in
          # PATH is too old, kconfig silently downgrades LTO/CFI/SCS here.
          echo "=== ABI-critical config check ==="
          for opt in CONFIG_LTO_CLANG CONFIG_CFI_CLANG CONFIG_SHADOW_CALL_STACK; do
            grep -q "${opt}=y" .config || { echo "FATAL: ${opt} is not enabled - toolchain too old at config time!"; exit 1; }
          done
          echo "LTO/CFI/SCS all enabled at config time - toolchain OK"

      - name: Build kernel image
        run: |
          cd kernel
          # Full LLVM toolchain is REQUIRED for LTO/CFI/SCS to stay enabled
          export PATH="$GITHUB_WORKSPACE/neutron-clang/bin:$PATH"
          make ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" Image

          # Verify the security/ABI features did NOT get downgraded
          echo "=== ABI-critical config check ==="
          for opt in CONFIG_LTO_CLANG CONFIG_CFI_CLANG CONFIG_SHADOW_CALL_STACK; do
            grep -q "${opt}=y" .config || { echo "FATAL: ${opt} is not enabled - toolchain too old!"; exit 1; }
          done
          echo "LTO/CFI/SCS all enabled - toolchain OK"

      - name: Prepare artifacts and AnyKernel3 flashable zip
        run: |
          mkdir -p out

          # Kernel image only. Our change is config-only (no DTS edits), so the
          # stock dtbo remains valid and must NOT be re-flashed. Raw *.dtbo
          # blobs are not a mkdtboimg-packed dtbo.img and must never be flashed.
          cp kernel/arch/arm64/boot/Image out/Image

          # Clone AnyKernel3 and build flashable zip (boot-only)
          cd out
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp Image anykernel/
          # anykernel.sh is a real file in the repo (heredocs inside YAML run
          # blocks break YAML parsing when their content is unindented)
          cp ../configs/anykernel.haydn.sh anykernel/anykernel.sh

          cd anykernel
          zip -r9 ../haydn-droidspaces-kernel.zip . -x '*.git*' '*~' './README.md'
          cd ../..
          ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haydn-kernel-droidspaces
          path: |
            out/Image
            out/haydn-droidspaces-kernel.zip
          retention-days: 7

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Image
            out/haydn-droidspaces-kernel.zip
          tag_name: ${{ github.ref }}
          name: Haydn Kernel Droidspaces ${{ github.ref_name }}
          generate_release_notes: false
