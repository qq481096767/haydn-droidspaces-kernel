name: Build Haydn Kernel for Droidspaces

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space (LTO builds need ~20GB)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm /opt/pipx 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Create swap (prevent OOM on 2GB runner)
        run: |
          # GitHub-hosted runners already mount /swapfile ("Text file busy"
          # if we skip this), so disable and recreate it
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libncurses5-dev \
            libncursesw5-dev xz-utils curl wget git lz4 cpio python3 \
            unzip zip p7zip-full device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang llvm lld patch

      - name: Clone LineageOS haydn kernel source
        run: |
          git clone --depth=1 -b lineage-23.2 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git kernel
          cd kernel
          echo "=== Kernel commit ==="
          git log --oneline -1
          echo "=== Available defconfigs ==="
          ls arch/arm64/configs/vendor/

      - name: Download Neutron Clang toolchain
        run: |
          # Same proven toolchain version as quilluna/android_kernel_oneplus_sm8350_ds.
          # No antman, no glibc patch: the patchelf'd glibc workaround makes
          # clang unstable (--version works, -E/compile fails -> CLANG_VERSION=0,
          # LLVM ERROR broken pipe storms). Just extract and use.
          mkdir -p "$GITHUB_WORKSPACE/neutron-clang"
          cd "$GITHUB_WORKSPACE/neutron-clang"
          wget -q "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst"
          tar -xf neutron-clang-06092026.tar.zst
          rm -f neutron-clang-06092026.tar.zst
          ./bin/clang --version | head -2
          echo 'int main(){return 0;}' | ./bin/clang -E -x c - | tail -1
          # Persist PATH for all later steps (config + build)
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      - name: Apply GKI KABI patches (required for 5.4 GKI, prevents bootloop)
        run: |
          cd kernel
          python3 ../scripts/apply_gki_kabi.py

      - name: Apply Droidspaces kernel config
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/neutron-clang/bin:$PATH"
          echo "=== toolchain probe ==="
          which clang; clang --version | head -1

          # quilluna approach: use the FULL stock kernel config (IKCONFIG-extracted
          # from the stock boot image) as the base. ALL probe-type symbols
          # (CLANG_VERSION, CC_IS_CLANG, LD_IS_LLD, LTO_CLANG, CFI_CLANG,
          # SHADOW_CALL_STACK, THINLTO ...) are already stored as user values
          # in haydn-stock.config; make uses them directly without re-probing.
          cp ../configs/haydn-stock.config .config

          # Apply Droidspaces options (overrides stock where needed)
          while IFS='=' read -r key val; do
            case "$key" in \#*|"") continue ;; esac
            case "$val" in
              y) scripts/config --file .config --enable "$key" ;;
              n) scripts/config --file .config --disable "$key" ;;
              m) scripts/config --file .config --module "$key" ;;
              *) scripts/config --file .config --set-str "$key" "$val" ;;
            esac
          done < ../configs/haydn-droidspaces.fragment

          echo "=== Verifying key Droidspaces options ==="
          grep -E 'CONFIG_(PID_NS|IPC_NS|UTS_NS|NAMESPACES|DEVTMPFS|SYSVIPC|POSIX_MQUEUE|SECCOMP)' .config || true

          # ABI-critical: these probe symbols come from stock.config user values,
          # NOT from kconfig probing, so they must stay enabled here.
          echo "=== ABI-critical config check ==="
          grep -E "CONFIG_(CLANG_VERSION|CC_IS_CLANG|LD_IS_LLD|LTO_CLANG|LTO_NONE|CFI_CLANG|SHADOW_CALL_STACK)[= ]" .config || true
          for opt in CONFIG_LTO_CLANG CONFIG_CFI_CLANG CONFIG_SHADOW_CALL_STACK; do
            grep -q "${opt}=y" .config || { echo "FATAL: ${opt} is not enabled - stock.config compromised!"; exit 1; }
          done
          echo "LTO/CFI/SCS all present from stock.config user values - probe-safe"

      - name: Build kernel image
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/neutron-clang/bin:$PATH"
          # LLVM=1 + LLVM_IAS=1 (quilluna's proven setup) keeps LTO/CFI/SCS enabled
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" Image

          # Verify the security/ABI features did NOT get downgraded
          echo "=== ABI-critical config check ==="
          for opt in CONFIG_LTO_CLANG CONFIG_CFI_CLANG CONFIG_SHADOW_CALL_STACK; do
            grep -q "${opt}=y" .config || { echo "FATAL: ${opt} is not enabled - toolchain too old!"; exit 1; }
          done
          echo "LTO/CFI/SCS all enabled - toolchain OK"

      - name: Prepare artifacts and AnyKernel3 flashable zip
        run: |
          mkdir -p out

          # Kernel image only. Our change is config-only (no DTS edits), so the
          # stock dtbo remains valid and must NOT be re-flashed. Raw *.dtbo
          # blobs are not a mkdtboimg-packed dtbo.img and must never be flashed.
          cp kernel/arch/arm64/boot/Image out/Image

          # Clone AnyKernel3 and build flashable zip (boot-only)
          cd out
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp Image anykernel/
          # anykernel.sh is a real file in the repo (heredocs inside YAML run
          # blocks break YAML parsing when their content is unindented)
          cp ../configs/anykernel.haydn.sh anykernel/anykernel.sh

          cd anykernel
          zip -r9 ../haydn-droidspaces-kernel.zip . -x '*.git*' '*~' './README.md'
          cd ../..
          ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haydn-kernel-droidspaces
          path: |
            out/Image
            out/haydn-droidspaces-kernel.zip
          retention-days: 7

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Image
            out/haydn-droidspaces-kernel.zip
          tag_name: ${{ github.ref }}
          name: Haydn Kernel Droidspaces ${{ github.ref_name }}
          generate_release_notes: false
