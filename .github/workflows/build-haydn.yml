name: Build Haydn Kernel for Droidspaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create swap (prevent OOM on 2GB runner)
        run: |
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libncurses5-dev \
            libncursesw5-dev xz-utils curl wget git lz4 cpio python3 \
            unzip zip p7zip-full device-tree-compiler

      - name: Clone LineageOS haydn kernel source
        run: |
          git clone --depth=1 -b lineage-23.2 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git kernel
          cd kernel
          echo "=== Kernel commit ==="
          git log --oneline -1
          echo "=== Available defconfigs ==="
          ls arch/arm64/configs/vendor/

      - name: Download LineageOS prebuilt clang toolchain (lineage-23.2, clang-r487747c)
        run: |
          mkdir -p toolchains/clang
          cd toolchains/clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r487747c.git .
          echo "CLANG_DIR=$GITHUB_WORKSPACE/toolchains/clang" >> $GITHUB_ENV
          ls bin/clang*

      - name: Apply GKI KABI patches (required for 5.4 GKI, prevents bootloop)
        run: |
          cd kernel
          patch -p1 < ../patches/gki/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          patch -p1 < ../patches/gki/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch

      - name: Apply Droidspaces kernel config
        run: |
          cd kernel
          DEFCONFIG=$(ls arch/arm64/configs/vendor/*qgki*defconfig 2>/dev/null | head -1)
          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: No qgki defconfig found in vendor/"
            ls arch/arm64/configs/vendor/
            exit 1
          fi
          echo "Using defconfig: $DEFCONFIG"
          make ARCH=arm64 "$(basename "$DEFCONFIG")"

          # Apply Droidspaces options to .config using scripts/config (precise, no duplicates)
          while IFS='=' read -r key val; do
            # Skip comments and blank lines
            case "$key" in
              \#*|"") continue ;;
            esac
            case "$val" in
              y) scripts/config --file .config --enable "$key" ;;
              n) scripts/config --file .config --disable "$key" ;;
              m) scripts/config --file .config --module "$key" ;;
              *) scripts/config --file .config --set-str "$key" "$val" ;;
            esac
          done < ../configs/haydn-droidspaces.fragment

          # Resolve dependencies and save back to defconfig
          make ARCH=arm64 olddefconfig
          make ARCH=arm64 savedefconfig
          mv defconfig "$DEFCONFIG"

          echo "=== Verifying key Droidspaces options ==="
          grep -E 'CONFIG_(PID_NS|IPC_NS|UTS_NS|NAMESPACES|DEVTMPFS|SYSVIPC|POSIX_MQUEUE|SECCOMP)' .config || true

      - name: Build kernel image
        run: |
          cd kernel
          export PATH="$CLANG_DIR/bin:$PATH"
          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" Image.gz-dtb dtbo

      - name: Prepare artifacts and AnyKernel3 flashable zip
        run: |
          mkdir -p out

          # Copy kernel image and dtbo
          cp kernel/arch/arm64/boot/Image.gz-dtb out/Image.gz-dtb
          if compgen -G "kernel/arch/arm64/boot/dts/qcom/*.dtbo" > /dev/null; then
            cp kernel/arch/arm64/boot/dts/qcom/*.dtbo out/
          else
            echo "WARNING: No dtbo files found"
            touch out/dtbo.img
          fi

          # Clone AnyKernel3 and build flashable zip
          cd out
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp Image.gz-dtb anykernel/
          cp *.dtbo anykernel/ 2>/dev/null || true

          # Write anykernel.sh properties for haydn
          cat > anykernel/anykernel.sh << 'AKSH'
#!/system/bin/sh
# AnyKernel3 by osm0sis
# Haydn Droidspaces Kernel
do.devicecheck=1
do.modules=0
do.cleanup=1
do.cleanuponabort=0
device.name1=haydn
device.name2=M2012K11C
device.name3=M2012K11AC
device.name4=M2012K11G
device.name5=M2012K11C
supported.versions=13,14,15,16
supported.patchlevels=
do.initd=0
do.save=0

. /tmp/anykernel/tools/ak2-core.sh;

# Mount partitions
mount_partitions

# Insert kernel
write_boot;

# End
unmount_partitions
AKSH

          cd anykernel
          zip -r9 ../haydn-droidspaces-kernel.zip . -x '*.git*' '*~' './README.md'
          cd ..
          ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haydn-kernel-droidspaces
          path: |
            out/Image.gz-dtb
            out/*.dtbo
            out/haydn-droidspaces-kernel.zip
          retention-days: 7

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Image.gz-dtb
            out/*.dtbo
            out/haydn-droidspaces-kernel.zip
          tag_name: ${{ github.ref }}
          release_name: Haydn Kernel Droidspaces ${{ github.ref_name }}
          generate_release_notes: false
